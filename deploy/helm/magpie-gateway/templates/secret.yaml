{{- $secret := .Values.sessionSecret -}}
{{- if or (eq $secret "") (eq $secret "change-me") (eq $secret "dev-only-change-me") (eq $secret "magpie-example-key") -}}
{{- fail "sessionSecret must be a real secret. The chart refuses an empty value, change-me, dev-only-change-me, and magpie-example-key." -}}
{{- end -}}
{{- if and (eq .Values.adminPassword "") (eq .Values.oidc.clientId "") -}}
{{- fail "Set adminPassword or oidc.clientId. The portal will not start without a way to sign in." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-portal
type: Opaque
stringData:
  sessionSecret: {{ $secret | quote }}
  adminPassword: {{ .Values.adminPassword | quote }}
  oidcClientSecret: {{ .Values.oidc.clientSecret | quote }}
