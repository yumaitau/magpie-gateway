name: magpie

on:
  pull_request:
    paths:
      - ui/**
      - schema/**
      - magpie/**
      - deploy/**
      - detections/**
      - docs/**
      - magpie.sh
      - .github/workflows/magpie.yml
  push:
    branches:
      - main
    paths:
      - ui/**
      - schema/**
      - magpie/**
      - deploy/**
      - detections/**
      - docs/**
      - magpie.sh
      - .github/workflows/magpie.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path magpie/Cargo.toml --all -- --check
      - name: Clippy
        # Relative CLIPPY_CONF_DIR is resolved from the rustc cwd (the magpie
        # workspace), so "magpie" does not exist there. Pin the directory that
        # holds magpie/.clippy.toml and keep the proxy config at the repo root
        # out of this workspace.
        run: CLIPPY_CONF_DIR="${GITHUB_WORKSPACE}/magpie" cargo clippy --manifest-path magpie/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path magpie/Cargo.toml

  deploy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning magpie.sh deploy/compose/smoke.sh
      - name: Helm chart
        run: |
          helm lint deploy/helm/magpie-gateway \
            --set secrets.MAGPIE_SESSION_SECRET=ci-session-secret \
            --set secrets.MAGPIE_ADMIN_PASSWORD=ci-admin-password-0001 \
            --set proxy.config='llm: {}'
          helm lint deploy/helm/magpie-gateway \
            --set secrets.MAGPIE_SESSION_SECRET=ci-session-secret \
            --set secrets.MAGPIE_ADMIN_PASSWORD=ci-admin-password-0001 \
            --set proxy.config='llm: {}' \
            --set ingress.enabled=true \
            --set ingress.host=magpie.example.com \
            --set ingress.certificateArn=arn:aws:acm:ap-southeast-2:123456789012:certificate/example
          if helm template t deploy/helm/magpie-gateway --set secrets.MAGPIE_SESSION_SECRET=change-me >/dev/null 2>&1; then
            echo "chart accepted a default session secret" >&2
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform
        working-directory: deploy/terraform/aws
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate

  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the portal
        run: cargo build --manifest-path magpie/Cargo.toml -p magpie-portal
      - name: Install Playwright
        working-directory: magpie/axe
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: axe
        run: |
          MAGPIE_DEMO=1 MAGPIE_SEED_EXAMPLES=1 MAGPIE_DATABASE_URL=:memory: \
            MAGPIE_COOKIE_SECURE=0 MAGPIE_LISTEN=127.0.0.1:8088 \
            ./magpie/target/debug/magpie-portal > /tmp/magpie-portal.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/magpie-portal.log
            exit 1
          fi
          npm test --prefix magpie/axe

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the portal image
        run: docker build -f deploy/portal.Dockerfile -t magpie-gateway-portal:ci .
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: magpie-gateway-portal:ci
          format: cyclonedx-json
          output-file: magpie-portal.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: magpie-portal-sbom
          path: magpie-portal.cdx.json
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: magpie-gateway-portal:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Proxy denies an unapproved tool
        run: |
          export MAGPIE_SESSION_SECRET="$(openssl rand -hex 32)"
          export MAGPIE_ADMIN_PASSWORD="$(openssl rand -hex 16)"
          export MAGPIE_PORTAL_IMAGE=magpie-gateway-portal:ci
          docker compose -f deploy/compose/docker-compose.yml up -d --no-build
          deploy/compose/smoke.sh
      - name: Stop compose
        if: always()
        env:
          # Compose interpolates the file before down. The secret is not used.
          MAGPIE_SESSION_SECRET: unused
          MAGPIE_ADMIN_PASSWORD: unused
        run: docker compose -f deploy/compose/docker-compose.yml down -v
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.2
      - name: Publish and sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/magpie-gateway-portal"
          docker tag magpie-gateway-portal:ci "${image}:${GITHUB_SHA}"
          docker push "${image}:${GITHUB_SHA}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${GITHUB_SHA}")"
          case "${digest}" in
            ghcr.io/*@sha256:*) ;;
            *) echo "expected a ghcr digest, got: ${digest}" >&2; exit 1 ;;
          esac
          docker tag "${image}:${GITHUB_SHA}" "${image}:main"
          docker push "${image}:main"
          cosign sign --yes "${digest}"
