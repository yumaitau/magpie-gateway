apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
spec:
  # SQLite on a ReadWriteOnce volume has one writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "magpie.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "magpie.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.proxy.config | sha256sum }}
        checksum/secrets: {{ toJson .Values.secrets | sha256sum }}
        checksum/environment: {{ toJson .Values.portal.environment | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: portal
          image: {{ .Values.portal.image | quote }}
          imagePullPolicy: {{ .Values.portal.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: portal
              containerPort: 8088
          env:
            - name: MAGPIE_DATABASE_URL
              value: /data/magpie.sqlite
            - name: MAGPIE_LISTEN
              value: 0.0.0.0:8088
            - name: MAGPIE_COOKIE_SECURE
              value: {{ ternary "1" "0" .Values.cookieSecure | quote }}
            {{- range $key, $value := .Values.portal.environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-portal
          volumeMounts:
            - name: data
              mountPath: /data
            - name: portal-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: portal
          livenessProbe:
            httpGet:
              path: /healthz
              port: portal
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
        {{- if .Values.proxy.enabled }}
        - name: proxy
          image: {{ .Values.proxy.image | quote }}
          imagePullPolicy: {{ .Values.proxy.imagePullPolicy }}
          args: ["--file", "/config/config.yaml"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: llm
              containerPort: 4000
            - name: ready
              containerPort: 15021
          env:
            - name: MAGPIE_PORTAL_HOST
              value: localhost:8088
            - name: AWS_REGION
              value: {{ .Values.proxy.awsRegion | quote }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-proxy
          volumeMounts:
            - name: proxy-config
              mountPath: /config
              readOnly: true
            - name: proxy-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: ready
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.presidio.enabled }}
        - name: presidio-analyzer
          image: "{{ .Values.presidio.analyzerRepository }}:{{ .Values.presidio.analyzerTag }}"
          # The community image runs as uid 1001. Do not inherit the portal uid.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-portal
        - name: portal-tmp
          emptyDir: {}
        - name: proxy-tmp
          emptyDir: {}
        {{- if .Values.proxy.enabled }}
        - name: proxy-config
          configMap:
            name: {{ .Release.Name }}-proxy
        {{- end }}
