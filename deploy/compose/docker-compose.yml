# Portal, notes server, and agentgateway on one network.
# The proxy allow list is deploy/compose/agentgateway.yaml.
# Set MAGPIE_SESSION_SECRET and MAGPIE_ADMIN_PASSWORD (16+ characters) before
# starting. The portal refuses the old defaults and will not start without a
# way to sign in.

services:
  portal-init:
    image: ${MAGPIE_PORTAL_IMAGE:-magpie-gateway-portal:0.1.0}
    build:
      context: ../..
      dockerfile: deploy/portal.Dockerfile
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 65532:65532 /data"]
    volumes:
      - portal-data:/data
    restart: "no"

  portal:
    image: ${MAGPIE_PORTAL_IMAGE:-magpie-gateway-portal:0.1.0}
    build:
      context: ../..
      dockerfile: deploy/portal.Dockerfile
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      MAGPIE_DATABASE_URL: /data/magpie.sqlite
      MAGPIE_LISTEN: 0.0.0.0:8088
      MAGPIE_COOKIE_SECURE: "1"
      MAGPIE_SESSION_SECRET: ${MAGPIE_SESSION_SECRET:?set MAGPIE_SESSION_SECRET}
      MAGPIE_DEMO: "0"
      MAGPIE_SEED_EXAMPLES: "0"
      MAGPIE_MOCK_IDP: "0"
      MAGPIE_ADMIN_PASSWORD: ${MAGPIE_ADMIN_PASSWORD:?set MAGPIE_ADMIN_PASSWORD}
      # Bearer token for agent OpenTelemetry at /otlp. Empty turns the receiver off.
      MAGPIE_OTLP_TOKEN: ${MAGPIE_OTLP_TOKEN:-}
    volumes:
      - portal-data:/data
    tmpfs:
      - /tmp
    depends_on:
      portal-init:
        condition: service_completed_successfully

  notes:
    image: python:3.12-slim
    command: ["python", "/srv/notes.py"]
    environment:
      CALL_LOG: /log/calls.log
      PORT: "3001"
    volumes:
      - ./notes.py:/srv/notes.py:ro
      - notes-log:/log
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/healthz')",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  proxy:
    image: ghcr.io/agentgateway/agentgateway:v1.6.0
    command: ["-f", "/example/config.yaml"]
    environment:
      EXAMPLE_API_KEY: unused
    volumes:
      - ./agentgateway.yaml:/example/config.yaml:ro
    ports:
      - "127.0.0.1:${MAGPIE_PROXY_PORT:-3000}:3000"
    depends_on:
      notes:
        condition: service_healthy
      portal:
        condition: service_started

  # Optional. Start with: docker compose --profile presidio up
  # Community images. Do not switch these to mcr.microsoft.com/presidio.
  # The published Dockerfiles run as uid 1001 and listen on 3000.
  # Do not override that user. A read-only root was not verified here.
  presidio-analyzer:
    profiles: ["presidio"]
    image: ghcr.io/data-privacy-stack/presidio-analyzer:latest
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5002:3000"

  presidio-anonymizer:
    profiles: ["presidio"]
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:latest
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5001:3000"

volumes:
  portal-data:
  notes-log:
