apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal
  labels:
    app.kubernetes.io/name: magpie-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: magpie-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magpie-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: MAGPIE_DATABASE_URL
              value: /data/magpie.sqlite
            - name: MAGPIE_LISTEN
              value: 0.0.0.0:8088
            - name: MAGPIE_COOKIE_SECURE
              value: {{ ternary "1" "0" .Values.cookieSecure | quote }}
            - name: MAGPIE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-portal
                  key: sessionSecret
            - name: MAGPIE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-portal
                  key: adminPassword
            - name: MAGPIE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-portal
                  key: oidcClientSecret
            - name: MAGPIE_ENTRA_TENANT_ID
              value: {{ .Values.oidc.entraTenantId | quote }}
            - name: MAGPIE_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: MAGPIE_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: MAGPIE_PUBLIC_URL
              value: {{ .Values.oidc.publicUrl | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
        {{- if .Values.presidio.enabled }}
        - name: presidio-analyzer
          image: "{{ .Values.presidio.analyzerRepository }}:{{ .Values.presidio.analyzerTag }}"
          # The community image runs as uid 1001. Do not inherit the portal uid.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-portal
        - name: tmp
          emptyDir: {}
