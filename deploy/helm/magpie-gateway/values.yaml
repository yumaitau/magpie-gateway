# Magpie Gateway. One pod runs the portal and the agentgateway proxy. The
# proxy calls the portal's guardrail webhook on localhost, so that route is
# never exposed. The portal keeps SQLite on a ReadWriteOnce volume, so the
# pod runs one replica and is replaced with the Recreate strategy.

portal:
  image: ghcr.io/yumaitau/magpie-gateway-portal:main
  imagePullPolicy: IfNotPresent
  # Non-secret MAGPIE_* settings, for example MAGPIE_PUBLIC_URL,
  # MAGPIE_ENTRA_TENANT_ID, MAGPIE_OIDC_CLIENT_ID, MAGPIE_BOOTSTRAP_MODELS.
  # Set MAGPIE_GUARDRAIL_MODE: log-only for a trial; default is enforce.
  environment: {}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

proxy:
  enabled: true
  image: ghcr.io/agentgateway/agentgateway:v1.6.0
  imagePullPolicy: IfNotPresent
  # agentgateway YAML. $MAGPIE_* and provider key names are expanded from
  # the container environment. ./magpie.sh writes it.
  config: ""
  awsRegion: ap-southeast-2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 1Gi}

# Secret settings. MAGPIE_SESSION_SECRET is required, and either
# MAGPIE_ADMIN_PASSWORD (16+ characters) or portal.environment
# MAGPIE_OIDC_CLIENT_ID. MAGPIE_* keys go to the portal; the proxy gets
# MAGPIE_WEBHOOK_TOKEN and every key that does not start with MAGPIE_.
secrets: {}

cookieSecure: true

persistence:
  size: 1Gi
  # Empty uses the cluster default class.
  storageClassName: ""

# EKS Auto Mode ships the EBS CSI driver but no StorageClass.
storageClass:
  create: false
  name: magpie-gp3
  provisioner: ebs.csi.eks.amazonaws.com
  # KMS key for the volume. Set it when the account encrypts EBS by default
  # with a customer key the cluster role cannot use; volumes are otherwise
  # created and then deleted. Empty uses the account default.
  kmsKeyId: ""

serviceAccount:
  name: magpie
  annotations: {}

# Register the pod with load balancer target groups created outside the
# chart. apiVersion is eks.amazonaws.com/v1 on EKS Auto Mode and
# elbv2.k8s.aws/v1beta1 with the self-managed AWS Load Balancer Controller.
targetGroupBinding:
  enabled: false
  apiVersion: eks.amazonaws.com/v1
  portalTargetGroupArn: ""
  proxyTargetGroupArn: ""
  # The controller opens these ports to the load balancer's security group.
  loadBalancerSecurityGroupId: ""

presidio:
  enabled: false
  # Community images, uid 1001, port 3000. Pin a digest before production.
  analyzerRepository: ghcr.io/data-privacy-stack/presidio-analyzer
  analyzerTag: latest

# The portal image is built for amd64 only. Without this, a cluster with
# Graviton nodes (EKS Auto Mode picks them freely) can schedule the pod on
# arm64 and the portal fails with "exec format error".
nodeSelector:
  kubernetes.io/arch: amd64

tolerations: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
