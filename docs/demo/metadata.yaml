  ## Demo Agenda at a Glance

  | Act | Segment | Time | Key Client Takeaway |
  |---|---|---|---|
  | Setup | Preflight & Reset | 5 min (before call) | 8 containers live, clean terminal + browser split |
  | Arch | AWS Sovereign Solution Architecture | 4 min | Zero-trust EKS + Bedrock AU + Entra ID + Sentinel |
  | Act 1 | Control Centre & Posture Presets | 5 min | Plain-English controls, diff preview, no YAML chaos |
  | Act 2 | Staged Cohort Rollout & AU DLP | 7 min | Enforced pilot blocked on TFN/ABN; trial team uninterrupted |
  | Act 3 | Sovereignty, PSPF & Response Scrubbing | 5 min | Foreign regions blocked; upstream TFN leaks scrubbed |
  | Act 4 | Four-Eyes Approvals & MCP Tool Control | 5 min | Separation of duties + unapproved MCP tools blocked |
  | Act 5 | Instant Per-Agent & Global Kill Switches | 3 min | Surgical containment in one click + instant recovery |
  | Act 6 | Entra SCIM, Intune, Sentinel & Evidence Pack | 6 min | Live SIEM stream + SHA-256 auditor evidence pack |

  All sample ABN, TFN, user identities (`alice.chen@agency.gov.au`, `bob.smith@agency.gov.au`, `carol.jones@agency.gov.au`), and virtual API keys in this guide are synthetic demo data. Compliance framework references follow Magpie Gateway's honest framing (clearly distinguishing direct vs interpretive controls).
