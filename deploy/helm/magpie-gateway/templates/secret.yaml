{{- $session := default "" .Values.secrets.MAGPIE_SESSION_SECRET -}}
{{- if or (eq $session "") (has $session (list "change-me" "dev-only-change-me" "magpie-example-key")) -}}
{{- fail "secrets.MAGPIE_SESSION_SECRET must be a real secret. Empty, change-me, dev-only-change-me and magpie-example-key are refused." -}}
{{- end -}}
{{- if and (eq (default "" .Values.secrets.MAGPIE_ADMIN_PASSWORD) "") (eq (default "" .Values.portal.environment.MAGPIE_OIDC_CLIENT_ID) "") -}}
{{- fail "Set secrets.MAGPIE_ADMIN_PASSWORD or portal.environment.MAGPIE_OIDC_CLIENT_ID. The portal will not start without a way to sign in." -}}
{{- end -}}
{{- if and .Values.proxy.enabled (eq .Values.proxy.config "") -}}
{{- fail "proxy.config is empty. ./magpie.sh writes it, or set proxy.enabled=false." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-portal
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- include "magpie.portalSecrets" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-proxy
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- include "magpie.proxySecrets" . }}
