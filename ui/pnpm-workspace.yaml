# Save new dependencies as =1.2.3, not pnpm's default ^1.2.3.
# https://pnpm.io/settings/other#saveprefix
savePrefix: '='

# Do not attempt to download the packageManager-pinned pnpm version.
# Network-restricted environments should warn and use the installed version.
pmOnFail: warn

# Monaco, Ajv, TanStack Router and PostCSS currently resolve vulnerable transitive releases.
overrides:
  ajv>fast-uri: 3.1.8
  monaco-editor>dompurify: 3.4.17
  seroval: 1.6.8
  seroval-plugins: 1.6.8
  source-map-js: 1.2.2
