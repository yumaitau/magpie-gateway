apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portal
  {{- if .Values.ingress.enabled }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
  {{- end }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8088
      targetPort: portal
  selector:
    {{- include "magpie.selector" . | nindent 4 }}
{{- if .Values.proxy.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-proxy
  {{- if .Values.ingress.enabled }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/healthcheck-port: "15021"
    alb.ingress.kubernetes.io/success-codes: "200"
  {{- end }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
spec:
  ports:
    - name: llm
      port: 4000
      targetPort: llm
    - name: ready
      port: 15021
      targetPort: ready
  selector:
    {{- include "magpie.selector" . | nindent 4 }}
{{- end }}
